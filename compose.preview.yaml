# Full original Gamefilled app in a private product preview; not the partial Identity lab.
# Invoke ONLY with: docker compose --project-name gamefilled-v2-preview
#    --env-file preview/.env.preview -f compose.preview.yaml ...
# GamefilledFullPreview and GamefilledV2Preview are distinct databases on the preview SQL volume.
# NEVER point this stack at web-01 / Gamefilleddb. Never run down -v.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: "${PREVIEW_SQL_PASSWORD:?Set PREVIEW_SQL_PASSWORD in preview/.env.preview}"
    volumes:
      - preview-sql:/var/opt/mssql
    networks:
      - database
    restart: unless-stopped
    mem_limit: 3g
    pids_limit: 300
    security_opt:
      - no-new-privileges:true

  migrator:
    profiles: ["setup"]
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    environment:
      ASPNETCORE_ENVIRONMENT: PreviewMigration
    command:
      - "--connection"
      - "Server=sql,1433;Database=GamefilledFullPreview;User Id=sa;Password=${PREVIEW_SQL_PASSWORD:?Set PREVIEW_SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True;Connect Timeout=30"
    depends_on:
      - sql
    networks:
      - database
    restart: "no"
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        GAMEFILLED_PREVIEW_REVISION: "${PREVIEW_REVISION:-local}"
    environment:
      ASPNETCORE_ENVIRONMENT: Preview
      ConnectionStrings__DefaultConnection: "Server=sql,1433;Database=GamefilledFullPreview;User Id=sa;Password=${PREVIEW_SQL_PASSWORD:?Set PREVIEW_SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True;Connect Timeout=30"
      Preview__Revision: "${PREVIEW_REVISION:-local}"
      ReverseProxy__TrustedNetwork: "172.28.81.2/32"
      DataProtection__KeysDirectory: "/app/keys"
      IGDB__ClientId: "${PREVIEW_IGDB_CLIENT_ID:?Set PREVIEW_IGDB_CLIENT_ID}"
      IGDB__ClientSecret: "${PREVIEW_IGDB_CLIENT_SECRET:?Set PREVIEW_IGDB_CLIENT_SECRET}"
    depends_on:
      - sql
    volumes:
      - ./preview/local/keys:/app/keys
    networks:
      - database
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "${PREVIEW_LAN_IP:?Set LAN IP}:8444:443/tcp"
    volumes:
      - ./preview/Caddyfile:/etc/caddy/Caddyfile:ro
      - preview-caddy-data:/data
      - preview-caddy-config:/config
    depends_on:
      - web
    networks:
      edge:
        ipv4_address: 172.28.81.2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  database:
    internal: true
  edge:
    ipam:
      config:
        - subnet: 172.28.81.0/24
          # Reserve .2 for Caddy; keep dynamically assigned web IPs in a distinct pool.
          ip_range: 172.28.81.128/25

volumes:
  preview-sql:
  preview-caddy-data:
  preview-caddy-config:
