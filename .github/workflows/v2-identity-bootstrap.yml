name: Scaffold V2 Identity migration once

on:
  push:
    branches:
      - feature/v2-identity-schema

permissions:
  contents: write

jobs:
  scaffold:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Testing
      ConnectionStrings__V2ModernDatabase: 'Server=127.0.0.1,1;Database=GamefilledV2ModernScaffold;User Id=sa;Password=OnlyAnUnusedPlaceholder_2026!;Encrypt=False;Connect Timeout=1'
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore EF CLI and modern Identity project
        run: |
          dotnet tool restore
          dotnet restore v2-modernization/Gamefilled.V2/Gamefilled.V2.csproj
          dotnet build v2-modernization/Gamefilled.V2/Gamefilled.V2.csproj --configuration Release --no-restore
      - name: Generate initial migration (no SQL connection or database update)
        run: |
          dotnet tool run dotnet-ef migrations add InitialIdentity \
            --project v2-modernization/Gamefilled.V2/Gamefilled.V2.csproj \
            --startup-project v2-modernization/Gamefilled.V2/Gamefilled.V2.csproj \
            --context GamefilledIdentityDbContext \
            --configuration Release \
            --no-build \
            --output-dir Data/Migrations
          # Build again so the freshly scaffolded migration and snapshot are loaded.
          dotnet build v2-modernization/Gamefilled.V2/Gamefilled.V2.csproj --configuration Release --no-restore
          dotnet tool run dotnet-ef migrations has-pending-model-changes \
            --project v2-modernization/Gamefilled.V2/Gamefilled.V2.csproj \
            --startup-project v2-modernization/Gamefilled.V2/Gamefilled.V2.csproj \
            --context GamefilledIdentityDbContext \
            --configuration Release \
            --no-build
      - name: Review scaffolded operations before committing
        run: |
          set -euo pipefail
          generated=$(find v2-modernization/Gamefilled.V2/Data/Migrations -name '*_InitialIdentity.cs' | head -n 1)
          test -n "$generated"
          # Inspect only Up: Down normally drops the newly created tables.
          if sed -n '/protected override void Up(/,/protected override void Down(/p' "$generated" \
              | grep -Eq 'migrationBuilder\.(Drop|Alter|Delete|Update)'; then
            echo 'Unexpected data modification in initial migration'
            exit 1
          fi
          echo 'Generated Identity tables:'
          grep 'name: "AspNet' "$generated" | sort -u
      - name: Commit generated files to the isolated feature branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2-modernization/Gamefilled.V2/Data/Migrations
          git diff --cached --quiet && { echo 'No migration generated'; exit 1; }
          git commit -m 'scaffold(v2): generated EF Core initial Identity migration'
          git push origin HEAD:feature/v2-identity-schema
