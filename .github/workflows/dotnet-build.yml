name: .NET Build

on:
  push:
    branches:
      - v2-development
      - "feature/**"
  pull_request:
    branches:
      - v2-development

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            Gamefilled.csproj
            tests/Gamefilled.Tests/Gamefilled.Tests.csproj
            .config/dotnet-tools.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Gamefilled.sln

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          dotnet build Gamefilled.sln --configuration Release --no-restore 2>&1 | tee build.log

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/Gamefilled.Tests/Gamefilled.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" 2>&1 | tee test.log

      - name: Publish
        shell: bash
        run: |
          set -o pipefail
          dotnet publish Gamefilled.csproj \
            --configuration Release \
            --no-build \
            --output ./artifacts/publish 2>&1 | tee publish.log

      - name: Build production container
        run: docker build --tag gamefilled:ci .

      - name: Generate EF baseline candidate
        if: github.ref == 'refs/heads/feature/production-foundation' || github.head_ref == 'feature/production-foundation'
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          ConnectionStrings__DefaultConnection: Server=127.0.0.1,1;Database=GamefilledBaseline;User Id=sa;Password=NotUsed_TestOnly_123!;Encrypt=False;Connect Timeout=1
          IGDB__ClientId: baseline-generation-client
          IGDB__ClientSecret: baseline-generation-secret
        run: |
          dotnet tool run dotnet-ef migrations add InitialBaseline \
            --project Gamefilled.csproj \
            --startup-project Gamefilled.csproj \
            --output-dir Data/Migrations \
            --no-build

      - name: Upload EF baseline candidate
        if: github.ref == 'refs/heads/feature/production-foundation' || github.head_ref == 'feature/production-foundation'
        uses: actions/upload-artifact@v4
        with:
          name: ef-baseline-candidate
          path: Data/Migrations
          if-no-files-found: error

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-test-logs
          path: |
            build.log
            test.log
            publish.log
            tests/Gamefilled.Tests/TestResults/**/*.trx
          if-no-files-found: warn
