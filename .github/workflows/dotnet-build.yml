name: .NET Build

on:
  push:
    branches:
      - v2-development
      - "feature/**"
  pull_request:
    branches:
      - v2-development

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: Gamefilled.csproj

      - name: Restore
        run: dotnet restore --locked-mode false

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          dotnet build --configuration Release --no-restore 2>&1 | tee build.log

      - name: Publish
        shell: bash
        run: |
          set -o pipefail
          dotnet publish --configuration Release --no-build --output ./artifacts/publish 2>&1 | tee publish.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            publish.log
          if-no-files-found: warn
