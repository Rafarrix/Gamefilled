name: .NET Build

on:
  push:
    branches:
      - master
      - v2-development
      - "feature/**"
  pull_request:
    branches:
      - master
      - v2-development

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            Gamefilled.csproj
            tests/Gamefilled.Tests/Gamefilled.Tests.csproj
            v2-modernization/Gamefilled.V2/Gamefilled.V2.csproj
            tests/Gamefilled.V2.Tests/Gamefilled.V2.Tests.csproj
            .config/dotnet-tools.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Gamefilled.sln

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          dotnet build Gamefilled.sln --configuration Release --no-restore 2>&1 | tee build.log

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/Gamefilled.Tests/Gamefilled.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" 2>&1 | tee test.log
          dotnet test tests/Gamefilled.V2.Tests/Gamefilled.V2.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=v3-test-results.trx" 2>&1 | tee v3-test.log

      - name: Verify EF migration snapshot
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          ConnectionStrings__DefaultConnection: Server=127.0.0.1,1;Database=GamefilledMigrationCheck;User Id=sa;Password=NotUsed_TestOnly_123!;Encrypt=False;Connect Timeout=1
          IGDB__ClientId: migration-check-client
          IGDB__ClientSecret: migration-check-secret
        shell: bash
        run: |
          set -o pipefail
          dotnet tool run dotnet-ef migrations has-pending-model-changes \
            --project Gamefilled.csproj \
            --startup-project Gamefilled.csproj \
            --configuration Release \
            --no-build 2>&1 | tee migration-check.log

      - name: Verify isolated V2 Identity migration snapshot
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          ConnectionStrings__V2ModernDatabase: Server=127.0.0.1,1;Database=GamefilledV2ModernCI;User Id=sa;Password=Unused_TestOnly_123!;Encrypt=False;Connect Timeout=1
        shell: bash
        run: |
          set -o pipefail
          dotnet tool run dotnet-ef migrations has-pending-model-changes \
            --project v2-modernization/Gamefilled.V2/Gamefilled.V2.csproj \
            --startup-project v2-modernization/Gamefilled.V2/Gamefilled.V2.csproj \
            --context GamefilledIdentityDbContext \
            --configuration Release \
            --no-build 2>&1 | tee identity-migration-check.log

      - name: Publish
        shell: bash
        run: |
          set -o pipefail
          dotnet publish Gamefilled.csproj \
            --configuration Release \
            --no-build \
            --output ./artifacts/publish 2>&1 | tee publish.log

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Build migration container
        shell: bash
        run: |
          set -o pipefail
          docker build --target migrator --tag gamefilled-migrator:ci . 2>&1 | tee migration-container.log

      - name: Build production container
        shell: bash
        run: |
          set -o pipefail
          docker build --target runtime --tag gamefilled:ci . 2>&1 | tee production-container.log

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-test-logs
          path: |
            build.log
            test.log
            v3-test.log
            migration-check.log
            identity-migration-check.log
            publish.log
            migration-container.log
            production-container.log
            tests/Gamefilled.Tests/TestResults/**/*.trx
            tests/Gamefilled.V2.Tests/TestResults/**/*.trx
          if-no-files-found: warn
