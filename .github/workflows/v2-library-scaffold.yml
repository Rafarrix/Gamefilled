name: Scaffold V2 Identity library migration (temporary)

on:
  push:
    branches:
      - feature/v2-identity-library

permissions:
  contents: write

jobs:
  scaffold:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Testing
      ConnectionStrings__V2ModernDatabase: "Server=127.0.0.1,1;Database=GamefilledV2ModernScaffold;User Id=sa;Password=OnlyUnusedTestPlaceholder_2026!;Encrypt=False;Connect Timeout=1"
    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore EF and build V2 modernization
        run: |
          dotnet tool restore
          dotnet restore v2-modernization/Gamefilled.V2/Gamefilled.V2.csproj
          dotnet build v2-modernization/Gamefilled.V2/Gamefilled.V2.csproj --configuration Release --no-restore
      - name: Scaffold new library migration without changing any database
        run: |
          dotnet tool run dotnet-ef migrations add AddGameLibrary \
            --project v2-modernization/Gamefilled.V2/Gamefilled.V2.csproj \
            --startup-project v2-modernization/Gamefilled.V2/Gamefilled.V2.csproj \
            --context GamefilledIdentityDbContext \
            --configuration Release --no-build \
            --output-dir Data/Migrations
          dotnet build v2-modernization/Gamefilled.V2/Gamefilled.V2.csproj --configuration Release --no-restore
          dotnet tool run dotnet-ef migrations has-pending-model-changes \
            --project v2-modernization/Gamefilled.V2/Gamefilled.V2.csproj \
            --startup-project v2-modernization/Gamefilled.V2/Gamefilled.V2.csproj \
            --context GamefilledIdentityDbContext \
            --configuration Release --no-build
      - name: Assert only GameLibraryEntries is created by Up()
        shell: bash
        run: |
          set -euo pipefail
          generated=$(find v2-modernization/Gamefilled.V2/Data/Migrations -name '*_AddGameLibrary.cs' | head -n 1)
          test -n "$generated"
          sed -n '/protected override void Up(/,/protected override void Down(/p' "$generated" > migration-up.txt
          grep -q 'name: "GameLibraryEntries"' migration-up.txt
          test "$(grep -c 'migrationBuilder.CreateTable' migration-up.txt)" -eq 1
          if grep -Eq 'migrationBuilder\.(Drop|Alter|Delete|Update|Rename)' migration-up.txt; then
            echo "Unexpected destructive operation in schema upgrade"
            exit 1
          fi
          echo "Safe additive migration generated."
      - name: Commit generated migration source to feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2-modernization/Gamefilled.V2/Data/Migrations
          git diff --cached --quiet && { echo "No migration changes"; exit 1; }
          git commit -m "scaffold(v2): generate GameLibraryEntries EF migration"
          git push origin HEAD:feature/v2-identity-library
